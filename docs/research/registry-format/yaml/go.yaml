# Go: build cache and module cache.
# Sources: https://pkg.go.dev/cmd/go (go clean, "Build and test caching")
#          https://go.dev/ref/mod (module cache)

kind: tool
name: go
executable: go

places:
  - name: build cache
    holds: cache
    path:
      command: go env GOCACHE
      env: GOCACHE
      default:
        macos: ~/Library/Caches/go-build
        # Derived from the documented rule "go-build in the user cache
        # directory"; the literal Linux path is not confirmed on a Linux
        # machine. It is wrong when XDG_CACHE_HOME is set and `go` is gone:
        # see README, "Missing from the contract".
        linux: ~/.cache/go-build
    measure:
      by: disk-usage
    clean:
      command: go clean -cache

  - name: module cache
    holds: cache
    path:
      command: go env GOMODCACHE
      env: GOMODCACHE
      # The documented default is $GOPATH/pkg/mod, and GOPATH defaults to ~/go.
      default:
        macos: ~/go/pkg/mod
        linux: ~/go/pkg/mod
    measure:
      by: disk-usage
    # The module cache is created read-only, so removing the directory fails;
    # the tool's own command works either way.
    clean:
      command: go clean -modcache
